<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Semester Mentor - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#8dcdff",
                        "primary-fixed-dim": "#ffb94c",
                        "on-tertiary-fixed-variant": "#004b70",
                        "surface-bright": "#fbf9f8",
                        "inverse-on-surface": "#f2f0f0",
                        "on-surface-variant": "#514534",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e4e2e2",
                        "on-primary-container": "#5b3b00",
                        "surface-tint": "#815500",
                        "tertiary-fixed": "#cae6ff",
                        "secondary-container": "#e2dfde",
                        "tertiary": "#006493",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#1c1b1b",
                        "surface-container-low": "#f5f3f3",
                        "primary-container": "#e8a020",
                        "on-primary-fixed": "#291800",
                        "surface-container-high": "#e9e8e7",
                        "primary": "#815500",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#001e30",
                        "on-secondary-container": "#636262",
                        "surface": "#fbf9f8",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1b1c1c",
                        "tertiary-container": "#4ab7fc",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#ffddb2",
                        "outline": "#847562",
                        "background": "#fbf9f8",
                        "on-tertiary": "#ffffff",
                        "on-background": "#1b1c1c",
                        "inverse-primary": "#ffb94c",
                        "outline-variant": "#d6c4ae",
                        "secondary": "#5f5e5e",
                        "surface-variant": "#e4e2e2",
                        "secondary-fixed": "#e5e2e1",
                        "secondary-fixed-dim": "#c8c6c5",
                        "surface-dim": "#dbdad9",
                        "on-tertiary-container": "#004668",
                        "on-secondary-fixed-variant": "#474746",
                        "inverse-surface": "#303031",
                        "surface-container": "#efeded",
                        "on-primary-fixed-variant": "#624000"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack_sm": "8px",
                        "gutter": "24px",
                        "stack_lg": "32px",
                        "sidebar_width": "240px",
                        "stack_md": "16px",
                        "container_max_width": "1200px",
                        "navbar_height": "56px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-gutter font-body-md text-on-surface">
<!-- Note: TopNavBar and SideNavBar are suppressed because this is a transactional linear page (Login). -->
<main class="w-full max-w-[440px]">
<!-- Brand Header Context -->
<div class="text-center mb-stack_lg">
<h1 class="font-display-lg text-display-lg text-primary mb-stack_sm">Semester Mentor</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Academic Planner</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-lg border border-surface-variant shadow-[0px_2px_4px_rgba(0,0,0,0.04)] p-[40px]">
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack_lg text-center">Welcome Back</h2>
<form action="#" class="flex flex-col gap-stack_md" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-stack_sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-stack_md top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full h-[48px] pl-[48px] pr-stack_md bg-surface-container-lowest border border-surface-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-fixed-dim focus:ring-2 focus:ring-primary-fixed-dim/20 transition-all duration-150" id="email" name="email" placeholder="name@university.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-stack_sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors duration-150" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-stack_md top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full h-[48px] pl-[48px] pr-stack_md bg-surface-container-lowest border border-surface-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-fixed-dim focus:ring-2 focus:ring-primary-fixed-dim/20 transition-all duration-150" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-stack_sm mt-stack_sm">
<input class="w-4 h-4 rounded-[4px] border-surface-variant text-primary-fixed-dim focus:ring-primary-fixed-dim/20 cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer select-none" for="remember">Remember me for 30 days</label>
</div>
<!-- Login Button -->
<button class="w-full h-[48px] mt-stack_md bg-primary-fixed-dim hover:bg-[#ffc66b] text-[#291800] rounded-lg font-headline-sm text-headline-sm flex items-center justify-center transition-colors duration-150 active:scale-[0.98]" type="submit">
                    Login
                </button>
</form>
<!-- Registration Link -->
<div class="mt-stack_lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-semibold hover:text-primary-fixed-dim transition-colors duration-150 ml-1" href="#">Register</a>
</p>
</div>
</div>
</main>
</body></html>
