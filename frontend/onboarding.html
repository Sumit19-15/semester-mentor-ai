<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - Step 1 of 3</title>

        body {
            background-color: theme('colors.surface-bright');
        }
    </style>

<body class="min-h-screen flex items-center justify-center p-gutter">
<!-- Main Registration Container -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-lg border border-surface-container-highest shadow-[0px_2px_4px_rgba(0,0,0,0.04)] overflow-hidden">
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-container-highest">
<div class="h-full bg-primary-container w-1/3 transition-all duration-500 ease-out"></div>
</div>
<!-- Card Content -->
<div class="p-stack_lg">
<!-- Header Section -->
<div class="mb-stack_lg">
<span class="font-label-md text-label-md text-secondary tracking-widest uppercase mb-stack_sm block">Step 1 of 3</span>
<h1 class="font-headline-md text-headline-md text-on-surface mb-stack_sm">Create your account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Set up your profile to start organizing your semester efficiently.</p>
</div>
<!-- Form Form -->
<form class="space-y-stack_md flex flex-col">
<!-- Full Name Field -->
<div class="flex flex-col space-y-stack_sm">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all duration-150" id="fullName" name="fullName" placeholder="Jane Doe" type="text"/>
</div>
<!-- Email Field -->
<div class="flex flex-col space-y-stack_sm">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all duration-150" id="email" name="email" placeholder="jane@university.edu" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-stack_sm">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all duration-150" id="password" name="password" placeholder="••••••••" type="password"/>
<p class="font-label-sm text-label-sm text-secondary mt-1">Must be at least 8 characters.</p>
</div>
<!-- Action Area -->
<div class="mt-stack_lg flex items-center justify-between pt-stack_sm border-t border-surface-container-highest">
<a class="font-label-md text-label-md text-secondary hover:text-on-surface transition-colors duration-150" href="#">Log in instead</a>
<button class="bg-primary-container text-on-primary-fixed-variant hover:bg-primary-fixed-dim font-label-md text-label-md px-6 py-2 rounded-lg flex items-center space-x-2 transition-all duration-150 active:scale-95 shadow-sm" type="submit">
<span>Continue</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</div>
</div>
</body></html>
